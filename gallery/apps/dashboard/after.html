<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Service status</title>
<style>/*@include _base.css*/</style>
<style>
  .verdict { display:flex; align-items:center; gap:8px; }
  .three { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .three div { text-align:left; }
  .three .n { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
  .three .l { font-size:11px; color:var(--muted); }
  .three .n.bad { color:var(--danger); }
  details { margin-top:10px; }
  summary { cursor:pointer; font-size:12px; color:var(--accent); }
  details table { margin-top:6px; }
</style></head>
<body>
<div class="card">
  <div class="verdict">
    <span class="pill bad" id="state">checking</span>
    <strong class="grow" id="head">&nbsp;</strong>
  </div>
  <p class="small muted" id="because">&nbsp;</p>

  <div class="three" id="three"></div>

  <details id="more">
    <summary>Per-service breakdown</summary>
    <table><thead><tr><th>Service</th><th>Errors</th><th>p99</th></tr></thead>
    <tbody id="rows"></tbody></table>
  </details>

  <div class="origin"><span id="asof">&nbsp;</span></div>
</div>
<script>/*@include _bridge.js*/</script>
<script>
  var app = new App({ name: "Service status", version: "1.0.0" });

  app.ontoolresult = function (result) {
    var d = result.structuredContent || {};
    var pill = document.getElementById("state");
    pill.textContent = d.state;
    pill.className = "pill " + (d.state === "healthy" ? "good" : d.state === "degraded" ? "warm" : "bad");
    document.getElementById("head").textContent = d.headline || "";
    document.getElementById("because").textContent = d.because || "";
    document.getElementById("three").innerHTML = (d.headliners || []).map(function (m) {
      return '<div><div class="n' + (m.alarming ? " bad" : "") + '">' + m.value +
             '</div><div class="l">' + m.label + "</div></div>";
    }).join("");
    document.getElementById("rows").innerHTML = (d.services || []).map(function (s) {
      return "<tr><td>" + s.name + "</td><td>" + s.errorRate + "%</td><td>" + s.p99 + "ms</td></tr>";
    }).join("");
    document.getElementById("asof").textContent = "As of " + d.asOf + ".";
    app.reportSize();
  };

  document.getElementById("more").addEventListener("toggle", function () { app.reportSize(); });
  app.connect();
</script>
</body></html>
