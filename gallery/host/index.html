<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery mini host</title>
<style>
:root{
  --ink:#15181D; --muted:#5B6472; --rule:#D8DDE4; --wash:#F5F6F8; --paper:#FFFFFF;
  --accent:#0F5C8C; --accent-soft:#E7F0F6; --good:#2C6E49;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font-family:var(--sans);font-size:14px}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;height:100vh}
aside{background:var(--paper);border-right:1px solid var(--rule);padding:14px;overflow:auto}
aside h1{font-size:14px;margin:0 0 2px}
aside p{font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
aside .grp{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:14px 0 4px;font-weight:700}
aside button{display:block;width:100%;text-align:left;font:inherit;font-size:12.5px;
  background:none;border:0;border-radius:6px;padding:5px 7px;color:var(--ink);cursor:pointer}
aside button:hover{background:var(--wash)}
aside button .v{float:right;font-size:10px;color:var(--muted)}
main{overflow:auto;padding:26px 0 60px}
.chat{max-width:460px;margin:0 auto;padding:0 12px}
.bubble{border-radius:14px;padding:9px 13px;margin:0 0 12px;line-height:1.5;
  white-space:pre-wrap;max-width:100%}
.bubble.user{background:var(--accent);color:#fff;margin-left:auto;width:fit-content;
  max-width:80%;border-bottom-right-radius:5px}
.bubble.assistant{background:var(--paper);border:1px solid var(--rule)}
.bubble.app{background:transparent;padding:0;border:0}
.applabel{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);
  margin:0 0 5px 2px}
.applabel .from{margin-left:auto;font-size:10px}
.dotmark{width:7px;height:7px;border-radius:50%;background:var(--good)}
iframe{width:100%;border:1px solid var(--rule);border-radius:12px;background:var(--paper);
  display:block;transition:height .12s ease}
section.ctx{background:var(--paper);border-left:1px solid var(--rule);padding:14px;overflow:auto}
section.ctx h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin:0 0 8px}
.entry{font-family:var(--mono);font-size:11px;line-height:1.5;border-left:2px solid var(--rule);
  padding:4px 0 4px 8px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.entry.context{border-left-color:var(--good)}
.entry.tool{border-left-color:var(--accent)}
.entry .k{display:block;font-family:var(--sans);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.viewport{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);
  max-width:460px;margin:0 auto 14px;padding:0 12px}
.viewport input{width:82px}
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>Gallery mini host</h1>
    <p>Renders the book's apps the way a chat host would: sandboxed, narrow, and
       inside a transcript. Pick a scene.</p>
    <div id="menu"></div>
  </aside>

  <main>
    <div class="viewport">
      <span>guest viewport</span>
      <input type="range" id="width" min="300" max="640" value="380">
      <span id="w">380px</span>
      <button id="dark" style="margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--rule);
        background:var(--paper);border-radius:6px;padding:2px 8px;cursor:pointer">dark</button>
    </div>
    <div class="chat" id="chat"></div>
  </main>

  <section class="ctx">
    <h2>What the model sees</h2>
    <div id="ctx"></div>
  </section>
</div>

<script type="module">
import { MiniHost } from "./host.js";
import { SCENES } from "./scenes.js";

const chat = document.getElementById("chat");
const ctx = document.getElementById("ctx");

const host = new MiniHost({
  transcript: chat,
  onContext(e) {
    const div = document.createElement("div");
    div.className = "entry " + e.kind;
    const label = e.kind === "context" ? "ui/set-context"
      : e.kind === "tool" ? "tools/call " + e.tool : "ui/open-link";
    div.innerHTML = '<span class="k">' + label + "</span>";
    div.appendChild(document.createTextNode(
      e.text + (e.structured ? "\n" + JSON.stringify(e.structured, null, 1) : "")
    ));
    ctx.appendChild(div);
  },
});

async function play(scene) {
  chat.innerHTML = "";
  ctx.innerHTML = "";
  for (const step of scene.steps) {
    if (step.user) host.say("user", step.user);
    else if (step.assistant) host.say("assistant", step.assistant);
    else if (step.call) {
      const res = await host.render(step.call, step.args || {}, { height: step.height });
      if (step.after) host.say("assistant", step.after);
      window.__lastResult = res.result;
    }
  }
  window.__sceneDone = true;
}

const menu = document.getElementById("menu");
let group = "";
for (const scene of SCENES) {
  if (scene.group !== group) {
    group = scene.group;
    const h = document.createElement("div");
    h.className = "grp";
    h.textContent = group;
    menu.appendChild(h);
  }
  const b = document.createElement("button");
  b.innerHTML = scene.title + '<span class="v">' + (scene.variant || "") + "</span>";
  b.onclick = () => { location.hash = scene.id; play(scene); };
  menu.appendChild(b);
}

document.getElementById("width").addEventListener("input", (e) => {
  chat.style.maxWidth = e.target.value + "px";
  document.getElementById("w").textContent = e.target.value + "px";
});
document.getElementById("dark").addEventListener("click", () => {
  const dark = document.documentElement.dataset.mode !== "dark";
  document.documentElement.dataset.mode = dark ? "dark" : "light";
  document.body.style.filter = dark ? "invert(1) hue-rotate(180deg)" : "";
});

const initial = SCENES.find((s) => s.id === location.hash.slice(1)) || SCENES[0];
play(initial);
window.__play = (id) => play(SCENES.find((s) => s.id === id));
</script>
</body>
</html>
